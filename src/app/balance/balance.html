<div class="balance-container">
    <div class="balance-card">
        <div class="cycle-info">
            <p class="cycle-label">Ciclo actual</p>
            <p class="cycle-dates">{{ cycleStart }} - {{ cycleEnd }}</p>
        </div>

        <div class="remaining-budget">
            <p class="budget-label">Disponible</p>
            <p class="budget-amount">${{ remainingBudget }}</p>
        </div>

        <div class="budget-limit">
            <p class="limit-label">Límite del ciclo</p>
            <p class="limit-amount">${{ budgetLimit }}</p>
        </div>
    </div>
</div>

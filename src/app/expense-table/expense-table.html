<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 expense-table">
    <!-- Title Column -->
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Producto/Servicio</th>
        <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let element"> {{element.date}} </td>
    </ng-container>

    <!-- Amount Column -->
    <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> Monto </th>
        <td mat-cell *matCellDef="let element"> ${{element.amount}} </td>
    </ng-container>

    <!-- Payment Type Column -->
    <ng-container matColumnDef="payment_type">
        <th mat-header-cell *matHeaderCellDef> Tipo de pago </th>
        <td mat-cell *matCellDef="let element"> {{element.payment_type}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

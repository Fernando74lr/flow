<mat-toolbar id="navbar">
    <button matIconButton class="icon favorite-icon">
        <mat-icon>favorite</mat-icon>
    </button>
    <span>Flow</span>
    <div class="navbar-actions">
        <button matIconButton class="icon" (click)="toggleTheme()"
            [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'">
            <mat-icon>{{isDarkTheme() ? 'light_mode' : 'dark_mode'}}</mat-icon>
        </button>
        <button matIconButton class="icon">
            <mat-icon>share</mat-icon>
        </button>
    </div>
</mat-toolbar>
